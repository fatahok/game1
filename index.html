<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thales's Theorem – HTML5 Canvas Animation</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    canvas {
      display: block;
      background: #ffffff;
      border-radius: 8px;
      cursor: grab;
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f1f5f9;
      color: #0f172a;
      cursor: pointer;
    }
    button:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <canvas id="thalesCanvas" width="460" height="420"></canvas>
    <div class="controls">
      <button id="toggleBtn">Pause</button>
      <button id="resetBtn">Reset (12 cm / 9 cm)</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("thalesCanvas");
    const ctx = canvas.getContext("2d");
    const toggleBtn = document.getElementById("toggleBtn");
    const resetBtn = document.getElementById("resetBtn");

    // Circle geometry (scaled so diameter AB = 15 cm -> 300 px)
    const cx = canvas.width / 2;
    const cy = canvas.height / 2 + 10;
    const radius = 150; // 7.5 cm * 20 px/cm
    const pxPerCm = 20;

    // Tilt diameter AB slightly to match the reference diagram (~14 degrees)
    const baseTilt = -0.24;
    const angleA = Math.PI + baseTilt;
    const angleB = baseTilt;

    // Initial angle for C so AC = 12 cm and BC = 9 cm
    // cos(CAB) = 12 / 15 = 0.8 -> angle CAB = acos(0.8)
    const initialOffset = Math.acos(12 / 15);
    const initialAngleC = angleA + initialOffset;

    let angleC = initialAngleC;
    let direction = 1;
    let isPlaying = true;
    let isDragging = false;

    function polarToCartesian(angle) {
      return {
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle)
      };
    }

    function drawRightAngleMarker(A, B, C, size = 14) {
      const vCA = { x: A.x - C.x, y: A.y - C.y };
      const vCB = { x: B.x - C.x, y: B.y - C.y };
      const lenA = Math.hypot(vCA.x, vCA.y);
      const lenB = Math.hypot(vCB.x, vCB.y);

      if (lenA < 1 || lenB < 1) return;

      const uA = { x: (vCA.x / lenA) * size, y: (vCA.y / lenA) * size };
      const uB = { x: (vCB.x / lenB) * size, y: (vCB.y / lenB) * size };

      ctx.beginPath();
      ctx.moveTo(C.x + uA.x, C.y + uA.y);
      ctx.lineTo(C.x + uA.x + uB.x, C.y + uA.y + uB.y);
      ctx.lineTo(C.x + uB.x, C.y + uB.y);
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawPoint(pt, label, offsetX, offsetY) {
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = "#0f172a";
      ctx.fill();

      ctx.font = "bold 18px Georgia, serif";
      ctx.fillStyle = "#0f172a";
      ctx.fillText(label, pt.x + offsetX, pt.y + offsetY);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const A = polarToCartesian(angleA);
      const B = polarToCartesian(angleB);
      const C = polarToCartesian(angleC);
      const O = { x: cx, y: cy };

      // 1. Main Circle
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 2;
      ctx.stroke();

      // 2. Triangle ABC fill
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(C.x, C.y);
      ctx.lineTo(B.x, B.y);
      ctx.closePath();
      ctx.fillStyle = "rgba(59, 130, 246, 0.08)";
      ctx.fill();

      // 3. Diameter AB and chords AC, BC
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(B.x, B.y);
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(C.x, C.y);
      ctx.lineTo(B.x, B.y);
      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 2;
      ctx.stroke();

      // 4. Right angle indicator at C
      drawRightAngleMarker(A, B, C);

      // 5. Points and labels
      drawPoint(A, "A", -24, 14);
      drawPoint(B, "B", 10, 12);
      drawPoint(C, "C", -6, -14);
      drawPoint(O, "O", -8, 22);

      // 6. Side length measurements (in cm)
      const acCm = (Math.hypot(C.x - A.x, C.y - A.y) / pxPerCm).toFixed(1);
      const bcCm = (Math.hypot(C.x - B.x, C.y - B.y) / pxPerCm).toFixed(1);

      ctx.font = "16px system-ui, sans-serif";
      ctx.fillStyle = "#1e293b";
      ctx.fillText(`${acCm} cm`, (A.x + C.x) / 2 - 48, (A.y + C.y) / 2 - 6);
      ctx.fillText(`${bcCm} cm`, (B.x + C.x) / 2 + 10, (B.y + C.y) / 2 - 4);

      // Header readout
      ctx.font = "bold 15px system-ui, sans-serif";
      ctx.fillStyle = "#2563eb";
      ctx.fillText(`∠ACB = 90°   |   Diameter AB = 15.0 cm`, 95, 28);
    }

    function animate() {
      if (isPlaying && !isDragging) {
        angleC += 0.012 * direction;
        // Keep C moving smoothly along the upper semicircle between A and B
        const minAngle = angleA + 0.18;
        const maxAngle = angleB + Math.PI * 2 - 0.18;
        if (angleC >= maxAngle) {
          angleC = maxAngle;
          direction = -1;
        } else if (angleC <= minAngle) {
          angleC = minAngle;
          direction = 1;
        }
      }
      render();
      requestAnimationFrame(animate);
    }

    // Drag interaction for point C
    function updateAngleFromPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      let a = Math.atan2(clientY - rect.top - cy, clientX - rect.left - cx);
      if (a < angleA) a += Math.PI * 2;
      const minAngle = angleA + 0.12;
      const maxAngle = angleB + Math.PI * 2 - 0.12;
      angleC = Math.max(minAngle, Math.min(maxAngle, a));
    }

    canvas.addEventListener("pointerdown", (e) => {
      isDragging = true;
      updateAngleFromPointer(e);
    });
    window.addEventListener("pointermove", (e) => {
      if (isDragging) updateAngleFromPointer(e);
    });
    window.addEventListener("pointerup", () => {
      isDragging = false;
    });

    toggleBtn.addEventListener("click", () => {
      isPlaying = !isPlaying;
      toggleBtn.textContent = isPlaying ? "Pause" : "Play";
    });

    resetBtn.addEventListener("click", () => {
      angleC = initialAngleC;
      direction = 1;
      render();
    });

    animate();
  </script>
</body>
</html>
